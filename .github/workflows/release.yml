name: Release official plugin
on:
  push:
    tags: ['translate-v*', 'quick-notes-v*']
permissions:
  contents: read
concurrency:
  group: official-plugin-release
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'potato47/malatang-plugins'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.3'
      - name: Validate tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          bun -e 'const tag = process.env.RELEASE_TAG; const match = /^(translate|quick-notes)-v([0-9]+\.[0-9]+\.[0-9]+)$/.exec(tag); if (!match) throw Error("Invalid tag"); const pkg = await Bun.file(`plugins/${match[1]}/package.json`).json(); if (pkg.version !== match[2]) throw Error("Version mismatch"); await Bun.write(process.env.GITHUB_ENV, `PLUGIN_ID=${match[1]}\nPLUGIN_VERSION=${match[2]}\n`);'
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check && bun run test && bun run index:check
      - run: bun run pack "$PLUGIN_ID"
      - name: Publish immutable archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" "artifacts/$PLUGIN_ID-$PLUGIN_VERSION.tgz" "artifacts/$PLUGIN_ID-$PLUGIN_VERSION.tgz.sha256" "artifacts/$PLUGIN_ID.json" --verify-tag --title "$PLUGIN_ID $PLUGIN_VERSION" --notes '预构建插件归档；市场索引在公开归档验收后通过 PR 更新。'
      - name: Verify public archive and propose index promotion
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          git switch -c "catalog/$RELEASE_TAG" origin/main
          bun scripts/catalog.ts promote "artifacts/$PLUGIN_ID.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add marketplace.json
          git commit -m "market: publish $RELEASE_TAG"
          git push origin "catalog/$RELEASE_TAG"
          if ! gh pr create --base main --head "catalog/$RELEASE_TAG" --title "market: publish $RELEASE_TAG" --body '公开固定归档的 SHA-256 验收通过。合并后官方市场才能发现该版本。'; then
            echo '::warning::归档与索引候选已发布；仓库禁止 Actions 创建 PR 时，由维护者从 catalog 分支创建并验收 PR。不要重发同版本。'
            echo "索引尚未上架：请从 catalog/$RELEASE_TAG 向 main 创建 PR，执行 CI 后合并。" >> "$GITHUB_STEP_SUMMARY"
          fi
